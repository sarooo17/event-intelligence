name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.1.0.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify npm package
        run: |
          VERSION="$(npm view mcp-event-intelligence@0.1.0 version --json | tr -d '"')"
          test "$VERSION" = "0.1.0"
          echo "Verified npm mcp-event-intelligence@$VERSION"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server metadata
        run: ./mcp-publisher validate server.json

      - name: Check MCP Registry
        id: registry
        shell: bash
        run: |
          URL="https://registry.modelcontextprotocol.io/v0.1/servers/io.github.sarooo17%2Fevent-intelligence/versions/0.1.0"
          if curl -fsS "$URL" > /tmp/mcp-registry-entry.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to MCP Registry
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher publish server.json

      - name: Verify MCP Registry publication
        run: |
          curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.sarooo17%2Fevent-intelligence/versions/0.1.0"

      - name: Create GitHub Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "GitHub Release v0.1.0 already exists"
          else
            gh release create v0.1.0 \
              --target "$GITHUB_SHA" \
              --title "MCP Event Intelligence v0.1.0" \
              --notes-file docs/releases/v0.1.0.md
          fi
