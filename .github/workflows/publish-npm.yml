name: Publish npm

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to publish the package'
        required: true
        type: string
      expected_version:
        description: 'Exact package version approved by the operator'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # A skipped job can make the workflow green and accidentally trigger
      # downstream release.yml. Wrong intent MUST fail the whole job.
      - name: Enforce explicit main-branch release approval
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_CONFIRM" = "publish"

      - uses: actions/checkout@v4
        with:
          # Strict v1 signoff verifies the reviewed ancestor and rejects any
          # non-ledger drift, so a shallow checkout cannot establish proof.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Verify exact operator-selected version
        env:
          OPERATOR_VERSION: ${{ inputs.expected_version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPERATOR_VERSION"
          test "$(node -p "require('./package.json').version")" = "$OPERATOR_VERSION"

      # Stable v1 (and later stable majors) cannot publish from manual intent
      # alone. Require all nine SDK gates and independent exact-commit signoffs
      # before any registry write. Prereleases remain on npm next.
      - name: Enforce stable v1 readiness against exact checked-out commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != *-* ]]; then
            # Do not treat build metadata or malformed non-prerelease tags
            # as an unguarded stable release channel.
            if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Unsupported stable semver syntax"
              exit 1
            fi
          fi
          if [[ "$VERSION" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
            EI_RELEASE_SOURCE_SHA="$EXPECTED_SOURCE_SHA" node scripts/evidence/v1-release-readiness.mjs --strict
          fi

      - name: Use npm with Trusted Publishing support
        run: npm install --global "npm@^11.15.0"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release identity
        run: node scripts/check-release-manifest.mjs
      - name: Verify versioned API/compatibility and migration notes
        run: node scripts/check-release-compatibility-doc.mjs

      - name: Verify release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            test "$VERSION" = "$TAG_VERSION"
          fi
          npm run check
          npm run pack:check

      - name: Check npm
        id: npm
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "mcp-event-intelligence@$VERSION" version >/dev/null 2>&1; then
            # A successful stable Publish npm workflow must correspond to a
            # new publication: do not trigger Release from a stable no-op.
            if [[ "$VERSION" != *-* ]]; then
              echo "::error::Stable npm version already exists; refusing no-op publish"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.npm.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          # Never make a prerelease the default npm install/latest version.
          # Stable semver versions are published under latest, only after
          # the explicit manual main-branch confirmation at job startup.
          if [[ "$VERSION" == *-* ]]; then
            TAG=next
          else
            TAG=latest
          fi
          npm publish --access public --tag "$TAG"
