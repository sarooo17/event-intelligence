name: Publish npm

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to publish the package'
        required: true
        type: string
      expected_version:
        description: 'Exact package version approved by the operator'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # A skipped job can make the workflow green and accidentally trigger
      # downstream release.yml. Wrong intent MUST fail the whole job.
      - name: Enforce explicit main-branch release approval
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_CONFIRM" = "publish"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Verify exact operator-selected version
        env:
          OPERATOR_VERSION: ${{ inputs.expected_version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPERATOR_VERSION"
          test "$(node -p "require('./package.json').version")" = "$OPERATOR_VERSION"

      - name: Use npm with Trusted Publishing support
        run: npm install --global "npm@^11.15.0"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release identity
        run: node scripts/check-release-manifest.mjs
      - name: Verify versioned API/compatibility and migration notes
        run: node scripts/check-release-compatibility-doc.mjs

      - name: Verify release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            test "$VERSION" = "$TAG_VERSION"
          fi
          npm run check
          npm run pack:check

      - name: Check npm
        id: npm
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "mcp-event-intelligence@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.npm.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          # Never make a prerelease the default npm install/latest version.
          # Stable semver versions are published under latest, only after
          # the explicit manual main-branch confirmation at job startup.
          if [[ "$VERSION" == *-* ]]; then
            TAG=next
          else
            TAG=latest
          fi
          npm publish --access public --tag "$TAG"
