name: Railway validation PostgreSQL smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ei_validation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ei_validation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EI_VALIDATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ei_validation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/railway-validation.test.mjs
