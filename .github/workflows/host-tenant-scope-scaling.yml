name: Host Tenant Scope Cold Start
on:
  pull_request:
    paths:
      - 'scripts/validation/host-tenant-scope-scale.mjs'
      - 'test/host-tenant-scope-scale.test.mjs'
      - 'docs/HOST-TENANT-SCOPE-SCALE.md'
      - '.github/workflows/host-tenant-scope-scaling.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-scope-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Validate reference process and scheduler lifecycle
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --test test/host-tenant-scope-scale.test.mjs
      - name: Record separate-process 1/10/100-scope diagnostic
        run: |
          mkdir -p artifacts
          node scripts/validation/host-tenant-scope-scale.mjs --tiers=1,10,100 --samples=3 > artifacts/host-scope-scale.json
      - name: Record actual fresh-process 1000-scope diagnostic
        run: |
          node scripts/validation/host-tenant-scope-scale.mjs --tiers=1000 --samples=1 > artifacts/host-scope-1000.json
      - name: Require real 1/10/100/1000 measurements and zero timer leaks
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const base=JSON.parse(readFileSync('artifacts/host-scope-scale.json'));
          const large=JSON.parse(readFileSync('artifacts/host-scope-1000.json'));
          assert.deepEqual(base.tiers.map(t=>t.scopeCount),[1,10,100]);
          assert.deepEqual(large.tiers.map(t=>t.scopeCount),[1000]);
          const combined=[...base.tiers,...large.tiers];
          for(const tier of combined)for(const sample of tier.samples){
            assert.equal(sample.loadedScopes,tier.scopeCount);
            assert.equal(sample.activeTemporalTimers,tier.scopeCount);
            assert.equal(sample.activeWakeRetryTimers,tier.scopeCount);
            assert.equal(sample.timersAfterClose,0);
            assert.equal(sample.createdIntervalHandles,sample.clearedIntervalHandles);
            assert(sample.rssAfterBytes>0 && sample.startupMs>=0);
          }
          assert.equal(base.sourceCommit,large.sourceCommit);
          writeFileSync('artifacts/host-scope-all-tiers-summary.json',JSON.stringify({
            schema:'ei.host-scope-tiers-summary.v1',
            sourceCommit:base.sourceCommit,
            tiers:combined.map(t=>({
              count:t.scopeCount,
              startupMedianMs:t.coldStartMs.median,
              rssDeltaMedianBytes:t.rssDeltaBytes.median,
              schedulerIntervalCount:t.samples[0].activeTemporalTimers+t.samples[0].activeWakeRetryTimers,
              sampleCount:t.samples.length,
              timersAfterClose:t.samples.every(s=>s.timersAfterClose===0)?0:null,
            })),
            coverage:{
              jsonlReferenceOnly:true,
              actualPostgresWorkerScale:false,
              recoveredPendingWakeSlo:false,
              productionCertification:false,
            },
          },null,2)+'\n');
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-scope-coldstart
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90