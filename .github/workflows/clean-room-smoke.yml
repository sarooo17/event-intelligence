name: Clean-room Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/clean-room-smoke.yml"
      - "README.md"
      - "package.json"
      - "server.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-room-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  published-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install published package in an empty project
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund mcp-event-intelligence@0.1.0

          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          const protocol = await import('mcp-event-intelligence');
          const host = await import('mcp-event-intelligence/host');

          assert.ok(Object.keys(protocol).length > 0, 'root package export is empty');
          assert.equal(typeof host.createEventIntelligenceHost, 'function');
          assert.equal(typeof host.createMcpRegistryAdapter, 'function');

          console.log('package imports OK');
          EOF

          test "$(npx --no-install mcp-event-intelligence --version)" = "0.1.0"
          npx --no-install mcp-event-intelligence --help | grep -qi "standard MCP stdio control plane"

      - name: Confirm MCP stdio entrypoint starts
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund mcp-event-intelligence@0.1.0

          npx --no-install mcp-event-intelligence mcp >/tmp/ei-mcp.out 2>/tmp/ei-mcp.err &
          PID=$!
          sleep 2

          if ! kill -0 "$PID" 2>/dev/null; then
            cat /tmp/ei-mcp.err
            exit 1
          fi

          kill "$PID"
          wait "$PID" || true
          echo "MCP stdio entrypoint started successfully"

      - name: Verify published metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view mcp-event-intelligence@0.1.0 version)" = "0.1.0"
          test "$(npm view mcp-event-intelligence@0.1.0 repository.url)" = "git+https://github.com/sarooo17/event-intelligence.git"
