name: Clean-room Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/clean-room-smoke.yml"
      - "README.md"
      - "docs/examples/packed-simple-trigger.mjs"
      - "docs/examples/packed-headless-host.mjs"
      - "docs/examples/packed-managed-consumer.mjs"
      - "docs/examples/packed-multi-target-host.mjs"
      - "docs/examples/packed-typed-simple-trigger.mts"
      - "docs/SIMPLE-TRIGGER-AUTHORING.md"
      - "package.json"
      - "package-lock.json"
      - "server.json"
      - "src/**"
      - "scripts/**"
      - "bin/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-room-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packed-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build candidate package
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          TARBALL="$(npm pack --silent)"
          echo "TARBALL=$PWD/$TARBALL" >> "$GITHUB_ENV"
          VERSION="$(node -p "require('./package.json').version")"
          echo "EXPECTED_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install candidate package in an empty project
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL"

          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          const protocol = await import('mcp-event-intelligence');
          const host = await import('mcp-event-intelligence/host');
          const postgres = await import('mcp-event-intelligence/storage/postgres');

          assert.ok(Object.keys(protocol).length > 0, 'root package export is empty');
          assert.equal(typeof protocol.TriggerPlanInputSchema, 'object');
          assert.equal(typeof protocol.ActivationEnvelopeSchema, 'object');
          assert.equal(typeof host.createEventIntelligenceHost, 'function');
          assert.equal(typeof host.createMcpRegistryAdapter, 'function');
          assert.equal(typeof postgres.PostgresEventStore, 'function');
          assert.equal(postgres.POSTGRES_STORE_CAPABILITIES.sharedState, 'strong');

          const dataDir = './ei-data';
          const ei = await host.createEventIntelligenceHost({
            dataDir,
            env: {
              TYPESAFE_API_KEY: '',
              RUNTIME_WAKE_TARGETS_JSON: '{}',
              TEMPORAL_TICK_MS: '100000',
              WAKE_RETRY_TICK_MS: '100000',
            },
          });
          assert.equal(typeof ei.planTrigger, 'function');
          assert.equal(typeof ei.hydrateWake, 'function');
          await ei.close();

          console.log('candidate package imports and host APIs OK');
          EOF

          test "$(npx --no-install mcp-event-intelligence --version)" = "$EXPECTED_VERSION"
          npx --no-install mcp-event-intelligence --help | grep -qi "standard MCP stdio control plane"

      - name: Exercise neutral embedded facade in two empty external Node hosts
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL"

          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { createEventIntelligence } from 'mcp-event-intelligence/embedded';

          const env = {
            TYPESAFE_API_KEY: '',
            RUNTIME_WAKE_TARGETS_JSON: '{}',
            TEMPORAL_TICK_MS: '100000',
            WAKE_RETRY_TICK_MS: '100000',
          };

          // Fixture A: headless workflow owner. No model SDK or EI source
          // checkout; event delivery always remains a host callback.
          const headless = await createEventIntelligence({
            mcp: { list: () => [] },
            runtime: {
              receiptNamespace: 'consumer-headless',
              deliver: () => ({ runtimeReceiptId: 'host-owned-receipt' }),
            },
            env, dataDir: './headless-state',
          });
          assert.equal(headless.toolCatalog.all.length, 0);
          assert.equal((await headless.diagnostics()).errors, 0);
          await headless.close();

          // Fixture B: a separate actor-scoped host exposing EI tools.
          // Host control remains mandatory; EI never invents approval.
          const managed = await createEventIntelligence({
            mcp: { list: () => [] },
            runtime: {
              deliver: () => ({ runtimeReceiptId: 'host-managed' }),
              resolveContext: () => ({
                owner: { type: 'user', principal_id: 'owner-consumer' },
                actor: { type: 'agent', principal_id: 'actor-consumer' },
              }),
              control: () => ({
                action: 'return',
                result: { ok: false, error: { code: 'HOST_APPROVAL_REQUIRED' } },
              }),
            },
            env, dataDir: './managed-state',
          });
          assert.equal(managed.toolCatalog.all.length, 8);
          const list = await managed.toolCatalog.get('trigger_list').execute({}, {});
          assert.equal(list.ok, true);
          assert.deepEqual(list.data.triggers, []);
          await managed.close();
          EOF

      - name: Run canonical simple-trigger example against packed npm consumer
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL"
          cp "$GITHUB_WORKSPACE/docs/examples/packed-simple-trigger.mjs" ./packed-simple-trigger.mjs
          node ./packed-simple-trigger.mjs | tee example-report.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const report=JSON.parse(fs.readFileSync('example-report.json','utf8'));
            if(report.status!=='pass'||report.mutations!==0||report.canonicalPattern!=='2')
              throw new Error('Packed simple-trigger example did not pass');
          "

      - name: Validate headless reference and typed payload API from an external packed npm consumer
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL" typescript@6.0.3
          cp "$GITHUB_WORKSPACE/docs/examples/packed-headless-host.mjs" ./headless.mjs
          cp "$GITHUB_WORKSPACE/docs/examples/packed-typed-simple-trigger.mts" ./typed.mts
          node ./headless.mjs | tee headless-report.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const report=JSON.parse(fs.readFileSync('headless-report.json','utf8'));
            if(report.status!=='pass'||report.tools!==0||report.wakes!==0||report.restarts!==1)
              throw new Error('External headless reference did not pass');
          "
          node ./node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck \
            --module NodeNext --moduleResolution NodeNext --target ES2022 ./typed.mts
      - name: Exercise public management and durable wake restart in a packed Node consumer
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL"
          cp "$GITHUB_WORKSPACE/docs/examples/packed-managed-consumer.mjs" ./managed-consumer.mjs
          node ./managed-consumer.mjs | tee managed-consumer-report.json
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('managed-consumer-report.json','utf8'));
          assert.equal(report.schema, 'event-intelligence.packed-managed-consumer.v1');
          assert.equal(report.status, 'pass');
          assert.equal(report.hostContractVersion, '1');
          assert.equal(report.hostRequiredCapabilities, 4);
          assert.equal(report.hostContractRejectedBeforeStart, true);
          assert.equal(report.approvalDeniedBeforeWrite, true);
          assert.equal(report.policyActionsVerified, 10);
          assert.equal(report.reopenedReceiptVerified, true);
          assert.equal(report.durableReplayStateUnchanged, true);
          assert.equal(report.starts, 2);
          assert.equal(report.deliveries, 2);
          assert.equal(report.replayRedeliveries, 0);
          assert.equal(report.management.length, 6);
          assert.equal(report.independentThirdPartyHost, false);
          EOF

      - name: Test public multi-target host with installed packed npm tarball
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL"
          cp "$GITHUB_WORKSPACE/docs/examples/packed-multi-target-host.mjs" ./multi-target.mjs
          node ./multi-target.mjs > multi-target-report.json
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('multi-target-report.json', 'utf8'));
          assert.equal(r.schema,'event-intelligence.packed-multi-target-host.v1');
          assert.equal(r.status,'pass');
          assert.deepEqual(r.targetKinds,['agent-task','graph-checkpoint','batch-job']);
          assert.equal(r.scopes,2);
          assert.equal(r.resumed,3);
          assert.equal(r.replaysDeduplicated,3);
          assert.equal(r.deniedTargets,2);
          assert.equal(r.independentThirdPartyHost,false);
          assert.equal(r.durableHostReceiptsProven,false);
          EOF

      - name: Confirm candidate MCP stdio entrypoint starts
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL"

          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { spawn } from 'node:child_process';

          const child = spawn(
            process.platform === 'win32' ? 'npx.cmd' : 'npx',
            ['--no-install', 'mcp-event-intelligence', 'mcp'],
            { stdio: ['pipe', 'pipe', 'pipe'] },
          );

          let stderr = '';
          child.stderr.setEncoding('utf8');
          child.stderr.on('data', (chunk) => {
            stderr += chunk;
          });

          await new Promise((resolve, reject) => {
            const timeout = setTimeout(
              () => reject(new Error(`MCP stdio did not become ready: ${stderr}`)),
              5000,
            );

            const check = () => {
              if (stderr.includes('mcp_event_intelligence_stdio_ready')) {
                clearTimeout(timeout);
                resolve();
              }
            };

            child.stderr.on('data', check);
            child.once('exit', (code, signal) => {
              clearTimeout(timeout);
              reject(
                new Error(
                  `MCP stdio exited before readiness (code=${code}, signal=${signal}): ${stderr}`,
                ),
              );
            });
          });

          assert.equal(child.exitCode, null, 'MCP stdio exited while stdin remained open');
          child.kill('SIGTERM');
          await new Promise((resolve) => child.once('exit', resolve));
          console.log('candidate MCP stdio entrypoint stayed alive with an open host connection');
          EOF
