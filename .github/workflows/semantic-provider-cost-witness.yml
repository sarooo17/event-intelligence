name: Semantic Provider Billing Witness Conformance
on:
  pull_request:
    paths:
      - 'scripts/validation/openai-responses-provider.mjs'
      - 'scripts/validation/openai-project-costs.mjs'
      - 'scripts/validation/run-openai-admin-cost-witness.mjs'
      - 'test/openai-responses-provider.test.mjs'
      - 'test/openai-admin-cost-witness.test.mjs'
      - 'test/openai-project-costs.test.mjs'
      - '.github/workflows/semantic-provider-cost-witness.yml'
permissions:
  contents: read
jobs:
  semantic-provider-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_intelligence"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/event_intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Local PostgreSQL16 with synthetic provider, zero external requests
        run: |
          node --test test/openai-responses-provider.test.mjs test/openai-project-costs.test.mjs test/openai-admin-cost-witness.test.mjs
      - name: Assert live provider secrets were never passed to the CI test job
        run: |
          node --input-type=module -e "if(process.env.OPENAI_API_KEY||process.env.OPENAI_ADMIN_KEY) process.exit(1);console.log('local-only synthetic provider validation; external billed use NOT certified')"
