name: Public Release Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "release/**"

concurrency:
  group: public-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Full test suite
        if: github.event_name != 'pull_request'
        run: npm run check

      - name: CEP compiled production mutation release gate
        if: github.event_name != 'pull_request'
        run: node scripts/evidence/cep-production-mutation-report.mjs --out cep-production-mutation-evidence.json

      - name: Retain CEP mutation release evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: public-release-cep-mutation-evidence
          path: cep-production-mutation-evidence.json
          if-no-files-found: error

      - name: Verify npm package contents
        run: npm run pack:check

      - name: Verify public exports against npm tarball
        run: node scripts/check-packed-exports.mjs

      - name: Build Docker image
        run: docker build -t mcp-event-intelligence:release-check .
