name: Public Release Check

# PR-authored code must never inherit a writable workflow token.
permissions:
  contents: read

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches:
      - main
      - "release/**"

concurrency:
  group: public-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact evidence source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Full test suite
        if: github.event_name != 'pull_request'
        run: npm run check

      # Run ALL non-Postgres evidence declared in
      # docs/security-threat-model-v1.json on PRs too, not merely the files'
      # existence check. Real PG proof runs in the dedicated service job.
      # Runtime/transport OAuth and host approvals still require operator
      # review: #45 is NOT completed by this test gate alone.
      - name: Verify versioned API/compatibility and migration notes
        run: node scripts/check-release-compatibility-doc.mjs

      - name: Build security conformance fixture
        run: npm run build

      - name: P0 complete non-Postgres security boundary evidence gate
        run: |
          node --test \
            test/security-threat-boundary-matrix.test.mjs \
            test/security-negative-evidence-ledger.test.mjs \
            test/mcp-occurrence-ingress-security.test.mjs \
            test/mcp-decoded-byte-budget-security.test.mjs \
            test/mcp-revoked-session-fencing.test.mjs \
            test/mcp-events-terminal-provider-errors.test.mjs \
            test/mcp-session-authority-host-contract.test.mjs \
            test/mcp-accepted-append-revoke-replay.test.mjs \
            test/mcp-provider-occurrence-name-error-boundary.test.mjs \
            test/mcp-provider-error-boundary.test.mjs \
            test/host-registry-shutdown-contract.test.mjs \
            test/neutral-facade-conformance.test.mjs \
            test/host-policy-untrusted-instruction-adversarial.test.mjs \
            test/mcp-owner-read-guard.test.mjs \
            test/mcp-owner-tenant-negative-mutation.test.mjs \
            test/untrusted-event-own-path-security.test.mjs \
            test/mcp-gap-atomic-finality-race.test.mjs \
            test/derived-events.test.mjs \
            test/trigger-explain-bounds.test.mjs \
            test/semantic-scope-budget-conformance.test.mjs \
            test/activation-provenance-security.test.mjs \
            test/observability-redaction-adversarial.test.mjs \
            test/observability-minimal-default-privacy.test.mjs \
            test/observability-own-data-security.test.mjs \
            test/release-manifest-parity.test.mjs

      - name: CEP compiled production mutation release gate
        if: github.event_name != 'pull_request'
        run: node scripts/evidence/cep-production-mutation-report.mjs --out cep-production-mutation-evidence.json

      - name: Retain CEP mutation release evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: public-release-cep-mutation-evidence
          path: cep-production-mutation-evidence.json
          if-no-files-found: error

      - name: Capture v1 release prerequisite ledger (report-only before 1.0)
        shell: bash
        run: node scripts/evidence/v1-release-readiness.mjs --report > v1-release-readiness.json

      # Source ancestry must be checked even for partially approved gate
      # ledgers (e.g. 5/9); 5/9 is still BLOCKED for stable publication.
      - name: Audit each partially verified v1 gate against frozen source
        env:
          EI_RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # PR base is derived from trusted protected main; never accept a PR-provided reviewed SHA.
          EI_RELEASE_REVIEWED_MAIN_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node scripts/evidence/v1-release-readiness.mjs --review-attestations

      - name: Retain v1 prerequisite evidence ledger
        uses: actions/upload-artifact@v4
        with:
          name: public-release-v1-readiness
          path: v1-release-readiness.json
          if-no-files-found: error

      - name: Verify npm package contents
        run: npm run pack:check

      - name: Verify public exports against npm tarball
        run: node scripts/check-packed-exports.mjs

      - name: Build Docker image
        run: docker build -t mcp-event-intelligence:release-check .

  postgres-security-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/event_intelligence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PostgreSQL evidence source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install bounded release evidence dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund pg@8
          npm run build
      - name: Pin PostgreSQL 16 dump/restore CLI to service container major
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ei-pg16-cli"
          for pgtool in pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/ei-pg16-cli/$pgtool" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --network host -v /tmp:/tmp \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE \
            postgres:16-alpine "$(basename "$0")" "$@"
          WRAPPER
            chmod 700 "$RUNNER_TEMP/ei-pg16-cli/$pgtool"
          done
          echo "$RUNNER_TEMP/ei-pg16-cli" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ei-pg16-cli/pg_dump" --version
          "$RUNNER_TEMP/ei-pg16-cli/pg_restore" --version
      - name: P0 real PostgreSQL security boundaries (never skip)
        run: |
          set -eu
          test -n "$POSTGRES_URL"
          node --test \
            test/postgres-inspector-restart.test.mjs \
            test/postgres-inspector-keyed-read.test.mjs \
            test/postgres-inspector-persisted-gap.test.mjs \
            test/postgres-inspector-strict-window.test.mjs \
            test/postgres-semantic-admission.test.mjs \
            test/postgres-logical-dump-restore.test.mjs \
            test/postgres-owner-revocation-snapshot.test.mjs \
            test/postgres-host-receipt-boundary.test.mjs \
            test/postgres-mcp-session-authority-fence.test.mjs \
            test/postgres-audit-proof-windows.test.mjs
