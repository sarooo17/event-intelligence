name: CI

on:
  pull_request:
    # Title edits can opt into the separately gated [match-chaos] job.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-release-manifest.mjs
      - run: npm run check
      - run: npm run conformance:pattern-v2
      - name: Produce bounded CEP budget evidence
        run: node scripts/evidence/pattern-v2-budget-evidence.mjs --out cep-budget-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: cep-budget-evidence
          path: cep-budget-evidence.json
          if-no-files-found: error
      - name: Kill bounded compiled CEP mutations (independent oracle)
        run: node scripts/evidence/cep-production-mutation-report.mjs --out cep-production-mutation-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: cep-production-mutation-evidence
          path: cep-production-mutation-evidence.json
          if-no-files-found: error

  postgres-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/event_intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund pg@8
      - name: Install PostgreSQL client backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          pg_dump --version
          pg_restore --version
      - run: npm run test:postgres
      - name: PostgreSQL scale harness smoke (isolated 16 triggers)
        env:
          EI_PG_BENCHMARK_CONFIRM: YES_ISOLATED
        run: node scripts/evidence/postgres-durable-scale.mjs --profile smoke --wakes 4 --concurrency 2

  pg-os-matched-contenders:
    # Explicit expensive evidence; no extra PostgreSQL runner on ordinary PRs.
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[match-chaos]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/event_intelligence
      EI_MATCH_KILL_ROUNDS: '12'
      EI_MATCH_KILL_EVIDENCE_OUT: os-matched-contenders.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install compiled test and pin PostgreSQL driver
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund pg@8.16.3
          npm run build
      - name: Capture exact benchmark source and hardware
        shell: bash
        run: |
          {
            echo "source-head-sha=$(git rev-parse HEAD)"
            echo "run-id=$GITHUB_RUN_ID"
            echo "run-attempt=$GITHUB_RUN_ATTEMPT"
            echo "rounds=$EI_MATCH_KILL_ROUNDS"
            node -p "'pg-driver=' + require('pg/package.json').version"
            node --version
            uname -a
            lscpu
            free -m
          } > os-matched-contenders-host.txt
      - name: Real OS SIGKILL then two independent competing PG worker processes
        shell: bash
        run: |
          set -o pipefail
          node --test test/postgres-os-matched-contenders.test.mjs 2>&1 |
            tee os-matched-contenders-test.log
      - name: Mark failure as incomplete rather than an invented passing report
        if: always()
        shell: bash
        run: |
          if [ ! -s "$EI_MATCH_KILL_EVIDENCE_OUT" ]; then
            printf '{"schema":"ei-postgres-os-matched-contenders-v1","status":"incomplete","requestedRounds":%s,"committedUniqueMatches":null,"recoveredDurableReceipts":null}\n' "$EI_MATCH_KILL_ROUNDS" > "$EI_MATCH_KILL_EVIDENCE_OUT"
          fi
      - name: Archive raw matched-to-wake chaos evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ei-pg-matched-contenders-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            os-matched-contenders.json
            os-matched-contenders-test.log
            os-matched-contenders-host.txt
          if-no-files-found: warn
          retention-days: 90
