name: PostgreSQL OS Kill Chaos (bounded evidence)

on:
  # Run real 60-round isolated SIGKILL/reclaim when THIS workflow changes.
  # Evidence gate #47: dedicated actual sixty-round PR soak run, with raw
  # JSON/log/host artifacts; never claim success solely from workflow YAML.
  # Ordinary feature PRs do not pay the 60-round Actions cost.
  pull_request:
    paths:
      - '.github/workflows/postgres-os-chaos-manual.yml'
  workflow_dispatch:
    inputs:
      rounds:
        description: Number of real OS kill/recovery rounds (bounded)
        type: choice
        options:
          - '30'
          - '60'
          - '120'
        default: '30'
        required: true

permissions:
  contents: read

concurrency:
  group: ei-pg-os-chaos-manual
  cancel-in-progress: false

jobs:
  bounded-os-chaos:
    name: Bounded PostgreSQL OS process chaos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ei_chaos
          POSTGRES_PASSWORD: ei_chaos_isolated
          POSTGRES_DB: ei_chaos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ei_chaos -d ei_chaos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_URL: postgresql://ei_chaos:ei_chaos_isolated@127.0.0.1:5432/ei_chaos
      EI_CHAOS_ROUNDS: ${{ github.event_name == 'pull_request' && '60' || inputs.rounds }}
      EI_CHAOS_EVIDENCE_OUT: ${{ runner.temp }}/pg-os-chaos-evidence.json
    steps:
      # This runs before checkout/install so even an early setup failure has
      # a persisted human-readable log in the always-uploaded artifact.
      - name: Initialize fail-closed chaos evidence log
        shell: bash
        run: |
          printf '%s\n' 'PostgreSQL OS kill chaos run initialized; no round completed yet.' > "$RUNNER_TEMP/pg-os-chaos-test.log"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies and PostgreSQL test driver
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund pg@8.16.3
          npm run build
      - name: Record exact commit and environment
        shell: bash
        run: |
          {
            echo "source-head-sha=$(git rev-parse HEAD)"
            echo "run-id=$GITHUB_RUN_ID"
            echo "run-attempt=$GITHUB_RUN_ATTEMPT"
            echo "rounds=$EI_CHAOS_ROUNDS"
            node -p "'pg-driver=' + require('pg/package.json').version"
            node --version
            uname -a
            lscpu
            free -m
          } > "$RUNNER_TEMP/pg-os-chaos-host.txt"
      - name: Run bounded independent-process OS kill evidence
        shell: bash
        run: |
          set -o pipefail
          node --test test/postgres-os-sigkill-recovery.test.mjs 2>&1 | tee "$RUNNER_TEMP/pg-os-chaos-test.log"
      - name: Guarantee explicit incomplete-run JSON evidence on failure
        if: always()
        shell: bash
        run: |
          # The Node soak harness writes a success JSON only after ALL
          # assertions. On any crash/setup error, preserve a truthful failure
          # status rather than suggesting zero loss/100% recovered receipts.
          if [ ! -s "$EI_CHAOS_EVIDENCE_OUT" ]; then
            printf '{"schema":"ei-postgres-os-chaos-v1","status":"incomplete","reason":"soak did not produce completed metrics","requestedRounds":%s,"killsConfirmed":null,"recoveredReceipts":null,"runId":"%s","runAttempt":"%s"}\n' "$EI_CHAOS_ROUNDS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$EI_CHAOS_EVIDENCE_OUT"
          fi
          if [ ! -f "$RUNNER_TEMP/pg-os-chaos-test.log" ]; then
            printf '%s\n' 'No test log created (setup failed before test execution).' > "$RUNNER_TEMP/pg-os-chaos-test.log"
          fi
      - name: Archive raw metrics and complete test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-os-chaos-${{ env.EI_CHAOS_ROUNDS }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pg-os-chaos-evidence.json
            ${{ runner.temp }}/pg-os-chaos-test.log
            ${{ runner.temp }}/pg-os-chaos-host.txt
          if-no-files-found: error
          retention-days: 30

  # Job services start before all steps. This separate runner is necessary
  # to retain explicit failure evidence when PostgreSQL never becomes healthy.
  service-startup-failure-evidence:
    name: Preserve failed chaos evidence
    needs: bounded-os-chaos
    if: ${{ always() && needs['bounded-os-chaos'].result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      EI_CHAOS_ROUNDS: ${{ github.event_name == 'pull_request' && '60' || inputs.rounds }}
    steps:
      - name: Write independent failure artifact without PostgreSQL
        shell: bash
        run: |
          printf '%s\n' 'Primary PostgreSQL chaos job failed; consult its runner logs for the root cause.' > "$RUNNER_TEMP/pg-os-chaos-fallback.log"
          printf '{"schema":"ei-postgres-os-chaos-v1","status":"incomplete","reason":"primary chaos job failed (including possible PostgreSQL service provisioning)","requestedRounds":%s,"killsConfirmed":null,"recoveredReceipts":null,"runId":"%s","runAttempt":"%s","origin":"independent-fallback-job"}\n' "$EI_CHAOS_ROUNDS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/pg-os-chaos-fallback.json"
      - name: Upload independent failure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-os-chaos-fallback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pg-os-chaos-fallback.json
            ${{ runner.temp }}/pg-os-chaos-fallback.log
          if-no-files-found: error
          retention-days: 30
