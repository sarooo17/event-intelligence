name: PostgreSQL Scale Evidence (isolated 1k/10k/100k)

on:
  # Reproducibly measure all three real store workloads only when this
  # benchmark workflow itself is reviewed. Ordinary PRs do not run the
  # expensive matrix; manual dispatch still selects a single profile.
  pull_request:
    paths:
      - ".github/workflows/postgres-scale-evidence.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: 'Durable trigger workload to measure (not a capacity claim)'
        required: true
        type: choice
        options:
          - 1k
          - 10k
          - 100k
      wakes:
        description: 'Number of measured wake cycles (1 to 1000)'
        required: true
        type: number
        default: 128

permissions:
  contents: read

jobs:
  benchmark:
    name: isolated-${{ matrix.profile }}
    strategy:
      # An out-of-memory or timeout at 100k is a measured failure, not
      # permission to cancel 1k/10k and lose their actual artifacts.
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'pull_request' && '["1k","10k","100k"]' || format('["{0}"]', inputs.profile)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/event_intelligence
      EI_PG_BENCHMARK_CONFIRM: YES_ISOLATED
      BENCH_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PROFILE: ${{ matrix.profile }}
      WAKES: ${{ github.event_name == 'pull_request' && '32' || inputs.wakes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund pg@8.16.3
          npm run build
      - name: Record reproducibility environment
        shell: bash
        run: |
          {
            echo "source-head-sha=$BENCH_SOURCE_COMMIT"
            echo "checked-out-sha=$(git rev-parse HEAD)"
            echo "github-run-id=$GITHUB_RUN_ID"
            echo "github-run-attempt=$GITHUB_RUN_ATTEMPT"
            node -p "'pg-driver=' + require('pg/package.json').version"
            uname -a
            node --version
            npm --version
            lscpu
            free -m
          } > benchmark-host.txt
      - name: Benchmark durable PostgreSQL operations
        shell: bash
        run: |
          set -o pipefail
          node scripts/evidence/postgres-durable-scale.mjs \
            --profile "$PROFILE" --wakes "$WAKES" --concurrency 4 \
            > benchmark-result.json 2> benchmark-errors.jsonl
          cat benchmark-result.json
      - name: Summarize only observed profiles (no production-SLO claim)
        run: |
          node scripts/evidence/postgres-scale-matrix.mjs benchmark-result.json > benchmark-matrix.json
          cat benchmark-matrix.json
      - name: Retain raw results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ei-postgres-scale-${{ env.PROFILE }}-${{ github.run_id }}
          path: |
            benchmark-result.json
            benchmark-matrix.json
            benchmark-errors.jsonl
            benchmark-host.txt
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: aggregate-actual-profiles
    # Run even when one benchmark fails; missing/invalid profiles must be
    # reported as failures, never replaced with synthetic zero values.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retrieve each actual profile artifact
        uses: actions/download-artifact@v4
        with:
          pattern: ei-postgres-scale-*-${{ github.run_id }}
          path: raw-profiles
          merge-multiple: false
      - name: Generate complete matrix or parseable failure evidence
        # Even if artifact download fails, publish a structured failed
        # report describing missing files instead of an empty JSON artifact.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/evidence/postgres-scale-matrix-report.mjs \
            actual-postgres-scale-matrix.json \
            "raw-profiles/ei-postgres-scale-1k-${GITHUB_RUN_ID}/benchmark-result.json" \
            "raw-profiles/ei-postgres-scale-10k-${GITHUB_RUN_ID}/benchmark-result.json" \
            "raw-profiles/ei-postgres-scale-100k-${GITHUB_RUN_ID}/benchmark-result.json"
          cat actual-postgres-scale-matrix.json
      - name: Archive consolidated matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ei-postgres-scale-matrix-${{ github.run_id }}
          path: actual-postgres-scale-matrix.json
          if-no-files-found: warn
          retention-days: 90
