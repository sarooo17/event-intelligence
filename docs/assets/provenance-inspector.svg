<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#151b25"/></linearGradient><style>.t{font-family:Arial,sans-serif;font-size:52px;font-weight:700;fill:#f5f7fb}.s{font-family:Arial,sans-serif;font-size:22px;font-weight:400;fill:#9ca9bd}.l{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#f5f7fb}.p{font-family:Arial,sans-serif;font-size:17px;font-weight:600;fill:#b8cbff}</style></defs><rect width="1600" height="900" rx="34" fill="url(#bg)"/><text x="90" y="105" class="t">Inspector: explain the trigger, not the model.</text><text x="90" y="150" class="s">Deterministic state shows what is satisfied, what is missing, and why a wake happened.</text><rect x="90" y="220" width="640" height="560" rx="30" fill="#101722" stroke="#29384e"/><text x="130" y="275" class="l">release-readiness · v1</text><rect x="130" y="315" width="560" height="58" rx="18" fill="#142437"/><text x="160" y="350" class="l">PASS · PR merged</text><text x="630" y="350" text-anchor="end" class="p">satisfied</text><rect x="130" y="390" width="560" height="58" rx="18" fill="#142437"/><text x="160" y="425" class="l">PASS · deploy succeeded</text><text x="630" y="425" text-anchor="end" class="p">satisfied</text><rect x="130" y="465" width="560" height="86" rx="18" fill="#1b2028" stroke="#4f5a69"/><text x="160" y="500" class="l">WAIT · no deploy.error for 10m</text><text x="160" y="532" class="s">next evaluation: 20:14 Europe/Rome</text><rect x="130" y="580" width="560" height="70" rx="18" fill="#192332"/><text x="160" y="613" class="l">why</text><text x="240" y="613" class="p">waiting_for_temporal_conditions</text><text x="160" y="640" class="s">No heuristic explanation; derived from engine state.</text><rect x="130" y="675" width="560" height="70" rx="18" fill="#15283a"/><text x="160" y="718" class="l">output</text><text x="290"