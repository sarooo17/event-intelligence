<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#151b25"/></linearGradient><style>.t{font-family:Arial,sans-serif;font-size:52px;font-weight:700;fill:#f5f7fb}.s{font-family:Arial,sans-serif;font-size:24px;font-weight:400;fill:#9ca9bd}.l{font-family:Arial,sans-serif;font-size:24px;font-weight:700;fill:#f5f7fb}.p{font-family:Arial,sans-serif;font-size:18px;font-weight:600;fill:#b8cbff}</style></defs><rect width="1600" height="900" rx="34" fill="url(#bg)"/><text x="90" y="110" class="t">Durable time: the wait survives the process.</text><text x="90" y="155" class="s">A pending absence deadline persists even when Event Intelligence is stopped.</text><line x1="130" y1="470" x2="1470" y2="470" stroke="#42516a" stroke-width="5"/><circle cx="220" cy="470" r="18" fill="#6ea8ff"/><text x="220" y="420" text-anchor="middle" class="l">email.received</text><text x="220" y="520" text-anchor="middle" class="p">deadline persisted</text><circle cx="600" cy="470" r="18" fill="#ffad66"/><text x="600" y="420" text-anchor="middle" class="l">service stops</text><text x="600" y="520" text-anchor="middle" class="p">agent + process offline</text><circle cx="980" cy="470" r="18" fill="#ffad66"/><text x="980" y="420" text-anchor="middle" class="l">deadline passes</text><text x="980" y="520" text-anchor="middle" class="p">no provider event arrives</text><circle cx="1370" cy="470" r="18" fill="#7fe0ad"/><text x="1370" y="420" text-anchor="middle" class="l">service restarts</text><text x="1370" y="520" text-anchor="middle" class="p">deadline recovered</text><rect x="1120" y="610" width="390" height="150" rx="28" fill="#152338" stroke="#35547a"/><text x="1315" y="663" text-anchor="middle" class="l">reply.overdue@1</text><text x="1315" y="705" text-anchor="middle" class="s">internal timer → derived event</text><text x="1315" y="740" text-anchor="middle" class="p">→ signed runtime wake</text><path d="M1370 495 C1370 565 1330 580 1315 610" stroke="#7fe0ad" stroke-width="4" fill="none"/><rect x="90" y="690" width="770" height="86" rx="22" fill="#101722"/><text x="125" y="725" class="l">Key property</text><text x="125" y="758" class="s">No polling loop, no live LLM, no new external event required.</text></svg>