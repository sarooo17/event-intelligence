<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#141a24"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter><style>.title{font-family:Arial,sans-serif;font-size:58px;font-weight:700;fill:#f7f9fc}.sub{font-family:Arial,sans-serif;font-size:26px;font-weight:400;fill:#9aa8bd}.label{font-family:Arial,sans-serif;font-size:26px;font-weight:700;fill:#f7f9fc}.small{font-family:Arial,sans-serif;font-size:20px;font-weight:400;fill:#9aa8bd}.pill{font-family:Arial,sans-serif;font-size:18px;font-weight:600;fill:#b9ccff}.arrow{stroke:#6f7f99;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7f99"/></marker></defs><rect width="1600" height="900" rx="34" fill="url(#bg)"/><text x="90" y="110" class="title">The agent can sleep. The intent keeps running.</text><text x="90" y="158" class="sub">Embedded temporal event intelligence that reuses the agent host's existing MCP registry.</text><g filter="url(#shadow)"><rect x="90" y="270" width="300" height="330" rx="28" fill="#151b25" stroke="#2b3546"/><text x="130" y="325" class="label">Host MCP registry</text><text x="130" y="370" class="small">GitHub MCP</text><circle cx="340" cy="362" r="7" fill="#6ea8ff"/><text x="130" y="415" class="small">Gmail / CI MCP</text><circle cx="340" cy="407" r="7" fill="#7de3ff"/><text x="130" y="460" class="small">Private / custom MCP</text><circle cx="340" cy="452" r="7" fill="#8fd6a8"/><rect x="126" y="505" width="218" height="46" rx="23" fill="#1d2634"/><text x="235" y="535" text-anchor="middle" class="pill">Events-capable auto-attached</text></g><g filter="url(#shadow)"><rect x="520" y="220" width="560" height="430" rx="34" fill="#101722" stroke="#3a4f71" stroke-width="2"/><rect x="560" y="260" width="480" height="66" rx="20" fill="#182336"/><text x="800" y="302" text-anchor="middle" class="label">Event Intelligence</text><rect x="565" y="355" width="225" height="90" rx="22" fill="#16202d" stroke="#2d405a"/><text x="678" y="392" text-anchor="middle" class="small">Composite triggers</text><text x="678" y="420" text-anchor="middle" class="pill">allOf · sequence · count</text><rect x="810" y="355" width="225" height="90" rx="22" fill="#16202d" stroke="#2d405a"/><text x="923" y="392" text-anchor="middle" class="small">Temporal engine</text><text x="923" y="420" text-anchor="middle" class="pill">absence · deadlines · calendar</text><rect x="565" y="470" width="225" height="90" rx="22" fill="#16202d" stroke="#2d405a"/><text x="678" y="507" text-anchor="middle" class="small">Derived events</text><text x="678" y="535" text-anchor="middle" class="pill">release.ready@1</text><rect x="810" y="470" width="225" height="90" rx="22" fill="#16202d" stroke="#2d405a"/><text x="923" y="507" text-anchor="middle" class="small">Contract registry</text><text x="923" y="535" text-anchor="middle" class="pill">schema + fingerprint</text><rect x="620" y="585" width="360" height="42" rx="21" fill="#142336"/><text x="800" y="613" text-anchor="middle" class="pill">Persistent state · replay safety · provenance</text></g><g filter="url(#shadow)"><rect x="1210" y="270" width="300" height="330" rx="28" fill="#151b25" stroke="#2b3546"/><text x="1250" y="325" class="label">Harness / agents</text><rect x="1250" y="365" width="220" height="74" rx="20" fill="#1a2638"/><text x="1360" y="400" text-anchor="middle" class="small">Targeted wake</text><text x="1360" y="425" text-anchor="middle" class="pill">task · session · agent</text><text x="1250" y="490" class="small">One shared EI instance</text><text x="1250" y="530" class="small">Tools stay host-owned</text><text x="1250" y="570" class="small">No always-on LLM</text></g><path d="M390 435 C445 435 465 435 510 435" class="arrow"/><path d="M1080 435 C1135 435 1155 435 1200 435" class="arrow"/><rect x="90" y="745" width="1420" height="82" rx="25" fill="#101621" stroke="#253147"/><text x="130" y="795" class="label">Example</text><text x="290" y="795" class="small">PR merged + deploy succeeded + no error for 10m</text><text x="850" y="795" class="pill">→ release.ready@1 → wake only when true</text></svg>